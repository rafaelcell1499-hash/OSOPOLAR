name: Build ReelForge (Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Descargar FFmpeg (build GPL completo, incluye xfade/drawtext/NVENC)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $bin = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName bin\ffmpeg.exe
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") bin\ffprobe.exe
          .\bin\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Autotest del motor (genera medios, renderiza un reel de prueba)
        run: python tests/selftest.py

      - name: Compilar con PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --name ReelForge
          --exclude-module tkinter main.py

      - name: Copiar FFmpeg junto al ejecutable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\ReelForge\bin | Out-Null
          Copy-Item bin\ffmpeg.exe dist\ReelForge\bin\
          Copy-Item bin\ffprobe.exe dist\ReelForge\bin\
          Copy-Item README.md dist\ReelForge\

      - name: Empaquetar ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\ReelForge -DestinationPath ReelForge-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ReelForge-win64
          path: ReelForge-win64.zip

      - name: Publicar release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ReelForge-win64.zip
